kind = "api"
previewPath = "/api"
title = "BharatPhish Guard API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["python", "-m", "compileall", "artifacts/api-server/app"]

[services.production.build.env]
PYTHONUNBUFFERED = "1"

[services.production.run]
args = ["python", "-m", "app.main"]

[services.production.run.env]
PORT = "8080"
PYTHONPATH = "artifacts/api-server"
PYTHONUNBUFFERED = "1"

[services.production.health.startup]
path = "/api/healthz"
