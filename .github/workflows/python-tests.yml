name: Python tests

on:
  push:
    branches:
      - main
      - improve/smsense-backend-frontend-local-api
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: artifacts/api-server/requirements.txt
      - name: Install declared backend dependencies
        run: python -m pip install -r artifacts/api-server/requirements.txt
      - name: Compile backend and tools
        working-directory: artifacts/api-server
        run: python -m compileall -q app tools
      - name: Run unit tests (no model downloads)
        working-directory: artifacts/api-server
        run: python -m pytest -q
